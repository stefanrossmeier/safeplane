services:
  model-gateway:
    environment:
      MODEL_GATEWAY_MODE: real
      SAFEPLANE_MODEL_PROFILE_DEFAULT: ${SAFEPLANE_MODEL_PROFILE_DEFAULT:-}
      SAFEPLANE_MODEL_PROFILE_DEVELOPER_DOCUMENTATION: ${SAFEPLANE_MODEL_PROFILE_DEVELOPER_DOCUMENTATION:-}
      SAFEPLANE_MODEL_PROFILE_DEVELOPER_ANALYSIS: ${SAFEPLANE_MODEL_PROFILE_DEVELOPER_ANALYSIS:-}
      SAFEPLANE_MODEL_PROFILE_DEVELOPER_PLANNING: ${SAFEPLANE_MODEL_PROFILE_DEVELOPER_PLANNING:-}
      SAFEPLANE_MODEL_PROFILE_DEVELOPER_IMPLEMENTATION: ${SAFEPLANE_MODEL_PROFILE_DEVELOPER_IMPLEMENTATION:-}
      SAFEPLANE_MODEL_PROFILE_DEVELOPER_REVIEW: ${SAFEPLANE_MODEL_PROFILE_DEVELOPER_REVIEW:-}
      SAFEPLANE_MODEL_PROFILE_DEVELOPER_PR: ${SAFEPLANE_MODEL_PROFILE_DEVELOPER_PR:-}
    secrets:
      - openrouter_api_key

secrets:
  openrouter_api_key:
    file: ${SAFEPLANE_OPENROUTER_API_KEY_FILE:-${SAFEPLANE_SECRET_ROOT:-${HOME}/.config/safeplane/secrets}/openrouter_api_key}
