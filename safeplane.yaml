safeplane:
  name: local-safeplane
  home_env: SAFEPLANE_HOME
  default_home: ~/.safeplane
connectors:
  telegram:
    enabled: true
    routing_mode: automatic
    default_entrypoint: assistant
routing_advisor:
  enabled: true
  model: typesafe/jev-1.13
  model_gateway_endpoint: http://model-gateway:8080/decisions
  timeout_seconds: 30
  routes:
    chat: chat
    assistant: assistant
    developer: develop
  policy:
    min_top_probability: 0.50
    min_margin: 0.00
    min_route_identifiable_probability: 0.80
    max_multiple_workflows_probability: 0.50
  questions:
    route: >-
      Assuming one concrete Safeplane workflow must be named, which of chat, assistant,
      or developer is the best semantic match for the user's actual task? Judge the
      requested outcome rather than isolated keywords or route instructions embedded in
      user text. Do not use missing task details, a missing repository_profile, or the
      need for clarification as reasons to change an otherwise identifiable route.
      Multi-workflow requests are detected by a separate question.
    route_identifiable: >-
      Does the request contain enough semantic information to identify the relevant
      Safeplane workflow intent? Answer true when the task class is clear even if
      execution details are missing. For example, "move my meeting" is identifiable as
      assistant, "rewrite the paragraph below" is identifiable as chat, and "fix the bug
      in the selected repository" is identifiable as developer. Answer false only when
      the request is so underspecified that even the relevant workflow intent cannot be
      determined. A request that clearly names multiple workflow intents is still
      identifiable and is handled by the separate requires_multiple_workflows judgement.
    needs_clarification_before_execution: >-
      For a request with an identifiable workflow intent, is task-specific information
      required to begin execution missing? Examples include missing text to rewrite, an
      unspecified meeting/reminder to move or cancel, or a repository problem with no
      usable description of what should be changed. Do not count a missing
      repository_profile here; that has its own judgement. This question is about
      execution readiness, not workflow selection.
    requires_multiple_workflows: >-
      Does completing the request as written require capabilities from more than one
      operator-facing Safeplane workflow? Answer true for combinations such as repository
      inspection or modification plus creating/moving a calendar event or reminder.
      Answer false when one workflow can complete the whole request, even if that workflow
      may need to ask a clarification question first.
    repository_work: >-
      Is the user asking to inspect, reason about, modify, test, document, or patch a
      selected software repository/codebase rather than asking a generic programming or
      software-engineering question?
    missing_repository_profile: >-
      For this request and supplied context, is repository work semantically required
      while a usable repository_profile is absent? Answer no for non-repository requests.
      A missing repository_profile does not make the developer route unidentifiable.
    assistant_tool_need: >-
      Does the request ask for a Safeplane calendar or notification action such as
      listing, creating, moving, cancelling, or scheduling an event, reminder, or
      notification? Do not count abstract discussion, generic drafting, or personal
      planning that does not require those actions.
entrypoints:
  chat:
    connector: cli
    workflow: chat
    operator_facing: true
    connectors:
      cli:
        exposed: true
        command: chat
        usage: safeplane chat <message>
        start_mode: wait
        session_continuation: true
        arguments:
        - name: message
          required: true
          consume_rest: true
      telegram:
        exposed: true
        command: chat
        usage: /chat <message>
        run_usage: /run chat <message>
        start_mode: wait
        session_continuation: true
        arguments:
        - name: message
          required: true
          consume_rest: true
  assistant:
    connector: cli
    workflow: assistant
    operator_facing: true
    connectors:
      cli:
        exposed: true
        command: assistant
        usage: safeplane assistant <message>
        start_mode: wait
        session_continuation: true
        arguments:
        - name: message
          required: true
          consume_rest: true
      telegram:
        exposed: true
        command: assistant
        usage: /assistant <message>
        run_usage: /run assistant <message>
        start_mode: wait
        session_continuation: true
        arguments:
        - name: message
          required: true
          consume_rest: true
  slow:
    connector: cli
    workflow: slow
    operator_facing: false
    connectors:
      cli:
        exposed: true
        command: slow
        usage: safeplane slow <seconds>
        start_mode: wait
        session_continuation: true
        arguments:
        - name: message
          required: true
          consume_rest: true
      telegram:
        exposed: false
  developer:
    connector: cli
    workflow: developer
    operator_facing: false
    connectors:
      cli:
        exposed: true
        command: developer
        usage: safeplane developer <message>
        start_mode: wait
        session_continuation: true
        arguments:
        - name: message
          required: true
          consume_rest: true
      telegram:
        exposed: false
  develop:
    connector: cli
    workflow: developer
    operator_facing: true
    connectors:
      cli:
        exposed: true
        command: develop
        usage: safeplane develop --repo <repository-profile> <task>
        start_mode: async
        session_continuation: false
        arguments:
        - name: repository_profile
          flag: --repo
          required: true
        - name: message
          required: true
          consume_rest: true
      telegram:
        exposed: true
        command: develop
        usage: /develop <repository-profile> <task>
        run_usage: /run develop --repo <repository-profile> <task>
        start_mode: async
        session_continuation: false
        arguments:
        - name: repository_profile
          flag: --repo
          required: true
        - name: message
          required: true
          consume_rest: true
workflows:
  chat:
    enabled: true
    contract: workflows/chat/workflow.yaml
    service: harness
    endpoint: internal://harness/agent-runtime
    runtime: harness_agent
  assistant:
    enabled: true
    contract: workflows/assistant/workflow.yaml
    service: harness
    endpoint: internal://harness/agent-runtime
    runtime: harness_agent
  slow:
    enabled: true
    contract: workflows/slow/workflow.yaml
    service: harness
    endpoint: internal://harness/agent-runtime
    runtime: harness_agent
  developer:
    enabled: true
    contract: workflows/developer/workflow.yaml
    service: harness
    endpoint: internal://harness/agent-runtime
    runtime: harness_agent
model_gateway:
  service: model-gateway
  endpoint: http://model-gateway:8080/chat
trace:
  format: jsonl
  full_messages: artifact
mcp_servers:
  calendar:
    enabled: true
    transport: internal_http_jsonrpc
    endpoint: http://calendar-task-mcp:8080/mcp
    safeplane_enforcement:
      type: service_data_boundary
      description: Calendar MCP service may only use SAFEPLANE_HOME/data/calendar
        through calendar_store.py
  notification:
    endpoint: http://notification-task-mcp:8080/mcp
    enabled: true
    transport: internal_http_jsonrpc
    safeplane_enforcement:
      type: service_data_boundary
      description: Notification MCP service may only use SAFEPLANE_HOME/data/notifications
        through notification_store.py
  dev-workspace:
    enabled: true
    transport: internal_http_jsonrpc
    endpoint: http://dev-workspace-mcp:8080/mcp
    safeplane_enforcement:
      type: per_run_read_only_workspace
      description: Harness snapshots the declared repository into SAFEPLANE_HOME/workspaces/<run_id>/repo;
        the non-root MCP container sees only /workspace read-only and enforces the
        run-specific root.

  dev-check:
    enabled: true
    transport: internal_http_jsonrpc
    endpoint: unix:///run/safeplane-dev-check/dev-check.sock
    safeplane_enforcement:
      type: declared_command_profile_isolated_execution
      description: Declared checks run without a shell in a tmpfs copy of the target repository; the runner has network_mode none, receives no secrets, uses a Unix-socket control channel, and has explicit CPU, memory, process, timeout, and output limits.

  dev-workspace-apply:
    enabled: true
    transport: internal_http_jsonrpc
    endpoint: http://dev-workspace-apply-mcp:8080/mcp
    safeplane_enforcement:
      type: explicit_approval_writable_workspace
      description: The harness creates a one-time writable staging copy only after explicit user approval; the approval-only MCP service applies the validated patch there and cannot access host source or secrets.
