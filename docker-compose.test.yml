services:
  harness:
    ports:
      - "127.0.0.1:18787:8080"
    environment:
      SAFEPLANE_HOME: /data/safeplane
      SAFEPLANE_CONFIG: /app/safeplane.yaml
    depends_on:
      model-gateway:
        condition: service_healthy
      calendar-task-mcp:
        condition: service_healthy
  model-gateway:
    environment:
      SAFEPLANE_HOME: /data/safeplane
      WORKFLOW_CONTRACT_ROOT: /app/workflows
      MODEL_GATEWAY_MODE: fake
  calendar-task-mcp:
    environment:
      SAFEPLANE_HOME: /data/safeplane
