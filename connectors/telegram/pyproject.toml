[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeplane-telegram-connector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
safeplane-telegram-connector = "telegram_connector.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
