[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeplane-cli-connector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["safeplane-connector-client>=0.1.0"]

[project.scripts]
safeplane-cli = "safeplane_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
