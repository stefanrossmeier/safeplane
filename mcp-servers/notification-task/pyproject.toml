[project]
name = "notification-task-mcp"
version = "0.1.0"
description = "Safeplane notification task MCP server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
]

[project.scripts]
notification-task-mcp = "notification_task_mcp.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
