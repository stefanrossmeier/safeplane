name: Conrad governance tests
on:
  pull_request:
    paths: ['.github/conrad/**', '.github/workflows/conrad-*.yml']
  push:
    branches: [main]
    paths: ['.github/conrad/**', '.github/workflows/conrad-*.yml']
permissions:
  contents: read
jobs:
  tests:
    name: Governance unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/conrad -v
