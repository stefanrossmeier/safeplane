[project]
name = "safeplane-scheduler"
version = "0.1.0"
description = "Safeplane notification scheduler service"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
]

[project.scripts]
safeplane-scheduler = "safeplane_scheduler.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
