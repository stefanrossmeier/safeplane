[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeplane-web-research-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "safe-web-research @ https://github.com/stefanrossmeier/safe-web-research/archive/refs/tags/v0.1.0.tar.gz",
]

[tool.setuptools.packages.find]
where = ["src"]
